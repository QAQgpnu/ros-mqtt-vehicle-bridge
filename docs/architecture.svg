<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ROS to MQTT vehicle bridge architecture</title>
  <desc id="desc">Bidirectional flow between ROS nodes, a bridge node, an MQTT broker, and a dispatcher.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path d="M0,0 L8,4 L0,8 z" fill="#93c5fd"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="70" y="82" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">ROS–MQTT Vehicle Bridge</text>
  <text x="70" y="120" fill="#bfdbfe" font-family="Inter,Segoe UI,sans-serif" font-size="18">Small JSON boundary for reusable vehicle integrations</text>

  <g filter="url(#shadow)">
    <rect x="70" y="210" width="220" height="150" rx="18" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <rect x="380" y="180" width="260" height="210" rx="18" fill="#0f766e" stroke="#5eead4" stroke-width="2"/>
    <rect x="730" y="210" width="220" height="150" rx="18" fill="#7c2d12" stroke="#fdba74" stroke-width="2"/>
    <rect x="1000" y="210" width="140" height="150" rx="18" fill="#581c87" stroke="#d8b4fe" stroke-width="2"/>
  </g>

  <g fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <text x="180" y="255" font-size="23" font-weight="700">ROS nodes</text>
    <text x="180" y="290" font-size="16">publish / consume</text>
    <text x="180" y="320" font-size="16">std_msgs/String</text>

    <text x="510" y="240" font-size="23" font-weight="700">Bridge node</text>
    <text x="510" y="278" font-size="16">topic mapping</text>
    <text x="510" y="306" font-size="16">reconnect + QoS</text>
    <text x="510" y="334" font-size="16">env-only credentials</text>

    <text x="840" y="255" font-size="23" font-weight="700">MQTT broker</text>
    <text x="840" y="290" font-size="16">vehicle/task_cmd</text>
    <text x="840" y="320" font-size="16">vehicle/mqtt_cmd</text>

    <text x="1070" y="255" font-size="22" font-weight="700">Dispatcher</text>
    <text x="1070" y="290" font-size="16">cloud / web</text>
    <text x="1070" y="320" font-size="16">or operator CLI</text>
  </g>

  <g fill="none" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)">
    <path d="M290 255 C330 255 335 235 380 235"/>
    <path d="M640 235 C675 235 690 255 730 255"/>
    <path d="M950 275 C970 275 980 275 1000 275"/>
    <path d="M1000 325 C980 325 970 325 950 325"/>
    <path d="M730 345 C690 345 675 365 640 365"/>
    <path d="M380 365 C335 365 330 345 290 345"/>
  </g>
  <g fill="#dbeafe" font-family="Inter,Segoe UI,sans-serif" font-size="15">
    <text x="300" y="215">/vehicle/task_cmd_json</text>
    <text x="650" y="215">vehicle/task_cmd</text>
    <text x="964" y="258">commands</text>
    <text x="650" y="405">vehicle/mqtt_cmd</text>
    <text x="300" y="405">/vehicle/mqtt_cmd_json</text>
  </g>

  <rect x="70" y="490" width="1070" height="72" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="100" y="523" fill="#a7f3d0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">Public boundary: JSON only · no proprietary message package · no credentials in files</text>
  <text x="100" y="548" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">Native validation: ROS Noetic + Paho MQTT C++ · Offline demo: Python standard library</text>
</svg>

